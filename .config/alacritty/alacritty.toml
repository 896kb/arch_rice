[colors.bright]
black = "#969896"
blue = "#81a2be"
cyan = "#8abeb7"
green = "#b5bd68"
magenta = "#b294bb"
red = "#cc6666"
white = "#ffffff"
yellow = "#f0c674"

[colors.normal]
black = "#1d1f21"
blue = "#81a2be"
cyan = "#8abeb7"
green = "#b5bd68"
magenta = "#b294bb"
red = "#cc6666"
white = "#c5c8c6"
yellow = "#F0C674"

[colors.primary]
background = "#ffffff"
bright_foreground = "#ffffff"
foreground = "#c5c8c6"

[colors.cursor]
text = "#000000"
cursor = "#000000"

[font]
size = 10

[font.bold]
family = "Departure Mono"
style = "Bold"

[font.bold_italic]
family = "Departure Mono"
style = "Bold Italic"

[font.italic]
family = "Departure Mono"
style = "Italic"

[font.normal]
family = "Departure Mono"
style = "Regular"

[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "Return"
mods = "Control|Shift"

[window]
dynamic_padding = true
opacity = 0.01

[window.padding]
x = 15
y = 15

[cursor]
smooth_motion = true
smooth_motion_factor = 0.75
smooth_motion_spring = 0.4
smooth_motion_max_stretch_x = 3.0
smooth_motion_max_stretch_y = 3.0

[cursor.style]
blinking = "On"
