# Deployed to /etc/modprobe.d/nvidia-pm.conf by install.sh (nvidia_prime profiles).
#
# Fine-grained runtime power management: let the driver put the dGPU into D3cold
# when no client has it open, instead of only gating the clocks. This is what
# makes `gpu-run <app>` cost ~0W the rest of the time.
#
# 0x02 = enable for Turing and later on supported laptop platforms. Both the
# Z13's RTX 4070 (Ada) and the Book Pro's MX550 / RTX 2050 (Turing) qualify.
options nvidia NVreg_DynamicPowerManagement=0x02

# KMS is required for the Wayland/PRIME setup to work at all.
options nvidia_drm modeset=1
