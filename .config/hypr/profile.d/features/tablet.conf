# Feature: tablet — accelerometer rotation, pen, on-screen keyboard, edge gestures.

exec-once = ~/.local/bin/pen-screenshotd   # eraser-button region screenshot (needs input group)
exec-once = ~/.local/bin/touch-gestures    # lisgd: 3-finger swipe up toggles the on-screen keyboard
exec-once = ~/.local/bin/auto-rotate       # accelerometer auto-rotate (landscape-locked while keyboard attached)

# ASUS pen top button: single-click = Super+F20 (ignored); DOUBLE-click = Super+F19
# (keycode 197). Bind the raw code (keysym is remapped in the us keymap) -> Krita.
bind = SUPER, code:197, exec, ~/.local/bin/penbtn

# Krita lives on its own special (scratchpad) workspace, summoned by the pen button
windowrule = match:class ^(org.kde.krita)$, workspace special:krita silent
