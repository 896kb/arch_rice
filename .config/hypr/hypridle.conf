# hypridle — locks BEFORE sleep (so waking always asks for the password) + idle lock/dpms.
general {
    lock_cmd = pidof hyprlock || hyprlock          # never spawn a second hyprlock
    before_sleep_cmd = loginctl lock-session        # lock before suspend -> password on wake
    after_sleep_cmd = hyprctl dispatch dpms on      # make sure the screen comes back on
}

# 5 min idle -> lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 6 min idle -> screen off (on again on activity)
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
