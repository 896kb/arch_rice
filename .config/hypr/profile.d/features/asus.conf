# Feature: asus_platform + keyd — ASUS volume rocker, fan/perf profile, kbd LEDs.

exec-once = ~/.local/bin/fan-profile-osd   # OSD when the fan/perf profile changes (Fn+F5)

# Volume rocker (remapped by keyd) — doubles as a brightness control, mode toggled
# by pinching both buttons, which keyd emits as F24.
bindel = , XF86AudioRaiseVolume, exec, ~/.local/bin/rocker up
bindel = , XF86AudioLowerVolume, exec, ~/.local/bin/rocker down
bind = , F24, exec, ~/.local/bin/rocker toggle

# F7/F8 (keyboard's brightness Fn keys) -> KEYBOARD BACKLIGHT
# (screen brightness lives on the volume rocker on this machine)
bindl = , code:233, exec, ~/.local/bin/kbd-backlight up     # F8 = KEY_BRIGHTNESSUP
bindl = , code:232, exec, ~/.local/bin/kbd-backlight down   # F7 = KEY_BRIGHTNESSDOWN

# touchpad Fn key (sends KEY_F21 = xkb code:199) -> toggle the detachable
# keyboard's touchpad
bind = , code:199, exec, ~/.local/bin/touchpad-toggle
