[colors.bright]
black = "#969896"
blue = "#81a2be"
cyan = "#8abeb7"
green = "#b5bd68"
magenta = "#b294bb"
red = "#cc6666"
white = "#ffffff"
yellow = "#f0c674"

[colors.normal]
black = "#1d1f21"
blue = "#81a2be"
cyan = "#8abeb7"
green = "#b5bd68"
magenta = "#b294bb"
red = "#cc6666"
white = "#c5c8c6"
yellow = "#F0C674"

[colors.primary]
# Tomorrow Night's background rather than white. With `opacity` below this is
# what tints whatever is behind the window — white lightened a light wallpaper
# and left the grey foreground with nothing to sit against.
background = "#1d1f21"
bright_foreground = "#ffffff"
foreground = "#c5c8c6"

[colors.cursor]
# Both were #000000, which only worked while `background` was white — against the
# dark tint the cursor vanished entirely. Accent-coloured now, so it reads on any
# wallpaper, and lib/theme.sh recolours it to pink on the Xiaomi like everything
# else. `text` is the character UNDER the cursor, so it takes the dark shade.
text = "#1d1f21"
cursor = "#b5bd68"

[font]
size = 10

[font.bold]
family = "Departure Mono"
style = "Bold"

[font.bold_italic]
family = "Departure Mono"
style = "Bold Italic"

[font.italic]
family = "Departure Mono"
style = "Italic"

[font.normal]
family = "Departure Mono"
style = "Regular"

[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "Return"
mods = "Control|Shift"

[window]
dynamic_padding = true
# Just enough dark tint to keep text legible over a light wallpaper while
# staying essentially see-through. This is the one number to tune: 0 is fully
# transparent, 1 fully opaque.
opacity = 0.2

[window.padding]
x = 15
y = 15

[cursor]
smooth_motion = true
smooth_motion_factor = 0.75
smooth_motion_spring = 0.4
smooth_motion_max_stretch_x = 3.0
smooth_motion_max_stretch_y = 3.0

[cursor.style]
blinking = "On"
