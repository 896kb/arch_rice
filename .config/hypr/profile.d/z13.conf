# Profile: ROG Flow Z13 (GZ301VIC)
# Linked to ~/.config/hypr-profile.conf by install.sh and sourced from hyprland.conf.

# Monitors
monitor=DP-2,1920x1080@240,auto,1
# Match the internal panel by its stable EDID description, NOT the connector name
# (kernel/driver updates renamed it eDP-2 -> eDP-1 and broke the scale).
monitor=desc:Thermotrex Corporation TL134ADXP01-0,2560x1600@165,auto,1.25

# Steam's CEF UI re-scales itself crisply to land at the right size under the
# 1.25 fractional scale (see the xwayland block in hyprland.conf).
env = STEAM_FORCE_DESKTOPUI_SCALING,1.25

# Cursor theme is generated per host from the profile's accent colour
# (install.sh -> recolor-cursor). This machine is the canonical green.
env = XCURSOR_THEME,Bibata-Modern-Green

# Lock-screen clip, resolved relative to .config/quickshell/lock/.
# Pre-encoded 2880x1800 (16:10) from the 4K source.
env = RICE_LOCK_VIDEO,lock-z13.mp4
# Dark clip, so a light dim keeps the clock readable without hiding the scene.
env = RICE_LOCK_DIM,0.45

# Desktop wallpaper.
exec-once = swaybg -i ~/.config/background-z13.jpg -m fill

source = ~/.config/hypr/profile.d/features/nvidia-prime.conf
source = ~/.config/hypr/profile.d/features/asus.conf
source = ~/.config/hypr/profile.d/features/ipu6-camera.conf
source = ~/.config/hypr/profile.d/features/tablet.conf
