# Profile: Xiaomi Book Pro 2022
# Linked to ~/.config/hypr-profile.conf by install.sh and sourced from hyprland.conf.

# Monitors — 3840x2400 on 16" = 283 PPI, against the Z13's 225 PPI at 13.4".
# Pinned rather than left on `auto` so fractional scaling can't shift between
# boots. 1.5 gives ~189 logical PPI, i.e. 96% the UI size of the Z13's 1.25;
# matching it exactly would be 1.57. 1.25 here would render everything at 80%.
monitor=,preferred,auto,1.5

# Must equal the panel scale above, otherwise Steam's UI lands at the wrong size
# (force_zero_scaling in hyprland.conf makes XWayland render at native pixels).
# steam.desktop no longer hardcodes this — it inherits from the session env, so
# each host gets its own value from its own profile.
env = STEAM_FORCE_DESKTOPUI_SCALING,1.5

# Cursor theme is generated per host from the profile's accent colour
# (install.sh -> recolor-cursor). This machine is pink (#ff5f9e).
env = XCURSOR_THEME,Bibata-Modern-Pink

# Lock screen clip and dim live in profiles/xiaomi.sh, not here — install.sh
# writes them into the deploy tree so they don't depend on a session restart.

# Desktop wallpaper. Source was 3200x1800 (16:9); centre-cropped to 2880x1800 so
# it matches this panel's 16:10 aspect and swaybg only has to scale, not crop.
exec-once = swaybg -i ~/.config/background-xiaomi.jpg -m fill

# Standard clamshell brightness keys — this machine has no volume rocker, so
# screen brightness stays on the Fn keys where it belongs.
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

source = ~/.config/hypr/profile.d/features/nvidia-prime.conf

# Volume keys. Defined here rather than in hyprland.conf because Hyprland stacks
# duplicate binds instead of replacing them — a shared default would fire
# alongside the Z13's rocker binding.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
