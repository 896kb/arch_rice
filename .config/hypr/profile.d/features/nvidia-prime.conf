# Feature: nvidia_prime — hybrid Intel iGPU + NVIDIA dGPU, dGPU asleep by default.
#
# The compositor itself is pinned to the Intel iGPU via AQ_DRM_DEVICES, which is
# resolved dynamically in ~/.bash_profile (DRM card numbers move across kernel
# updates, and a stale static value means a black screen — so it is NOT set here).
#
# Force glvnd to load ONLY the Mesa EGL vendor in the compositor. Otherwise the
# nvidia EGL vendor (10_nvidia.json) opens /dev/nvidia0 at startup and keeps the
# dGPU awake forever. `gpu-run` unsets this so offload apps can still use nvidia.
env = __EGL_VENDOR_LIBRARY_FILENAMES,/usr/share/glvnd/egl_vendor.d/50_mesa.json

# Same idea for GLX: XWayland/GLX apps (e.g. Steam's CEF UI) otherwise pick the
# nvidia GLX vendor and render on the dGPU, forcing a cross-GPU copy to the
# Intel-driven outputs (janky UI). Pin GLX to mesa too. `gpu-run` sets this to
# 'nvidia' explicitly, so game offload still works. (verified 2026-08-06)
env = __GLX_VENDOR_LIBRARY_NAME,mesa

# Run anything on the dGPU with:  gpu-run <command>     (alias: prime-run)
# Check state with:               gpu-run --status
