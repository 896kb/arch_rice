theme:
  active: White # current playing song in list
  banner: LightMagenta # the "spotify-tui" banner on launch
  error_border: Red # error dialog border
  error_text: LightRed # error message text (e.g. "Spotify API reported error 404")
  hint: Magenta # hint text in errors
  hovered: White # hovered pane border
  inactive: Magenta # borders of inactive panes
  playbar_background: White # background of progress bar
  playbar_progress: Magenta # filled-in part of the progress bar
  playbar_text: White # artist name in player pane
  selected: Magenta # a) selected pane border, b) hovered item in list, & c) track title in player
  text: "255, 255, 255" # text in panes