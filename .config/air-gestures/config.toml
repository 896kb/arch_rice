# air-gesturesd — Meta Neural Band gestures on the Z13 (see air-gestures/contrib/config.toml for every key).
# Reloaded on save.

[band]
hand = "band"
autostart = true
toggle = "middle_hold"   # long-press middle finger: controls off/on
on_toggle = '[ "$AIR_GESTURES_ENABLED" = 1 ] && ~/.local/bin/osd air-gestures "󰩏  Band on" || ~/.local/bin/osd air-gestures "󱠱  Band off"'

[gestures]
swipe_left    = "hyprctl dispatch workspace e-1"
swipe_right   = "hyprctl dispatch workspace e+1"
swipe_up      = "playerctl previous"
swipe_down    = "playerctl next"
index_double  = "~/.local/bin/air-gestures-dial toggle"   # dial: volume <-> brightness
middle_double = "~/.local/bin/audio-mute sink"
index_tap     = "playerctl play-pause"
middle_tap    = ""
middle_hold   = ""

[dial]
target = "volume"
sensitivity = 1.0
volume_up       = "~/.local/bin/air-gestures-dial volume up"
volume_down     = "~/.local/bin/air-gestures-dial volume down"
brightness_up   = "~/.local/bin/air-gestures-dial brightness up"
brightness_down = "~/.local/bin/air-gestures-dial brightness down"
