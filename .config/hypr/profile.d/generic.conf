# Profile: generic — unknown hardware, portable subset only.
# Linked to ~/.config/hypr-profile.conf by install.sh and sourced from hyprland.conf.

monitor=,preferred,auto,auto

env = XCURSOR_THEME,Bibata-Modern-Green

exec-once = swaybg -i ~/.config/background.png -m fill

bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Volume keys. Defined here rather than in hyprland.conf because Hyprland stacks
# duplicate binds instead of replacing them — a shared default would fire
# alongside the Z13's rocker binding.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
