# Feature: ipu6_camera — rear OV13B10 on Intel IPU6 + v4l2loopback bridge.

# CPU debayer so libcamera works without NVIDIA EGL (the compositor is Mesa-pinned)
env = LIBCAMERA_SOFTISP_MODE,cpu

# toggle the rear-camera webcam bridge (for Brave/V4L2 apps) — also a waybar button
bind = $mainMod SHIFT, C, exec, ~/.local/bin/rearcam-bridge toggle

# Rear-camera peek widget: mpv window titled "rearcam" -> small pinned 16:9 panel
# that slides in at the top-right (swipe down from the top-right corner triggers it).
windowrule = match:title ^(rearcam)$, float 1
windowrule = match:title ^(rearcam)$, size 320 180
# position is set per-orientation by rearcam-widget (cam-geometry) before launch
windowrule = match:title ^(rearcam)$, pin 1
windowrule = match:title ^(rearcam)$, rounding 8
windowrule = match:title ^(rearcam)$, animation slide

# Front-camera peek widget: mpv window titled "frontcam" -> small pinned 16:9
# panel that slides in at the top-LEFT (swipe down from the top-left corner).
windowrule = match:title ^(frontcam)$, float 1
windowrule = match:title ^(frontcam)$, size 320 180
# position is set per-orientation by frontcam-widget (cam-geometry) before launch
windowrule = match:title ^(frontcam)$, pin 1
windowrule = match:title ^(frontcam)$, rounding 8
windowrule = match:title ^(frontcam)$, animation slide
