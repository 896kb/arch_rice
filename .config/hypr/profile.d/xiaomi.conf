# Profile: Xiaomi Book Pro 2022
# Linked to ~/.config/hypr-profile.conf by install.sh and sourced from hyprland.conf.

# Monitors — internal HiDPI panel, pinned to 1.25 rather than left on `auto` so
# fractional scaling can't shift between boots. Same scale as the Z13, so UI
# elements come out the same physical size on both machines.
monitor=,preferred,auto,1.25

# Must equal the panel scale above, otherwise Steam's UI lands at the wrong size
# (force_zero_scaling in hyprland.conf makes XWayland render at native pixels).
env = STEAM_FORCE_DESKTOPUI_SCALING,1.25

# Cursor theme is generated per host from the profile's accent colour
# (install.sh -> recolor-cursor). This machine is pink (#ff5f9e).
env = XCURSOR_THEME,Bibata-Modern-Pink

# Lock-screen clip, resolved relative to .config/quickshell/lock/.
# Pre-encoded 2880x1800 (16:10) from the 4K source, audio stripped.
env = RICE_LOCK_VIDEO,lock-xiaomi.mp4
# No dim — this clip is meant to be seen at full brightness.
env = RICE_LOCK_DIM,0

# Standard clamshell brightness keys — this machine has no volume rocker, so
# screen brightness stays on the Fn keys where it belongs.
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

source = ~/.config/hypr/profile.d/features/nvidia-prime.conf
