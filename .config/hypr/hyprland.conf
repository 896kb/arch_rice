# ~/.config/hypr/hyprland.conf

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=DP-2,1920x1080@240,auto,1
# Match the internal panel by its stable EDID description, NOT the connector name
# (kernel/driver updates renamed it eDP-2 -> eDP-1 and broke the scale).
monitor=desc:Thermotrex Corporation TL134ADXP01-0,2560x1600@165,auto,1.25

# Execute your apps at launch
# rear camera (IPU6/ov13b10): CPU debayer so libcamera works without NVIDIA EGL
env = LIBCAMERA_SOFTISP_MODE,cpu

# NOTE: AQ_DRM_DEVICES (pin compositor to the Intel iGPU so the dGPU can sleep) is
# set DYNAMICALLY in ~/.bash_profile before start-hyprland — NOT here — because DRM
# card numbers can change across kernel updates and a static value risks a lockout.
# Force glvnd to load ONLY the Mesa EGL vendor in the compositor. Otherwise
# the nvidia EGL vendor (10_nvidia.json) opens /dev/nvidia0 at startup and keeps
# the dGPU awake. prime-run unsets this so offload apps can still use nvidia.
env = __EGL_VENDOR_LIBRARY_FILENAMES,/usr/share/glvnd/egl_vendor.d/50_mesa.json
# Same idea for GLX: XWayland/GLX apps (e.g. Steam's CEF UI) otherwise pick the
# nvidia GLX vendor and render on the dGPU, forcing a cross-GPU copy to the
# Intel-driven outputs (janky UI). Pin GLX to mesa too. prime-run sets this to
# 'nvidia' explicitly, so game offload still works. (verified 2026-08-06)
env = __GLX_VENDOR_LIBRARY_NAME,mesa

exec-once = waybar
exec-once = dunst
exec-once = nm-applet
exec-once = unclutter --hide-on-touch
exec-once = /home/user888/.local/bin/pen-screenshotd   # eraser-button region screenshot (needs input group, set up 2026-06-15)
exec-once = /home/user888/.local/bin/touch-gestures    # lisgd: 3-finger swipe up toggles the on-screen keyboard
exec-once = /home/user888/.local/bin/auto-rotate       # accelerometer auto-rotate (landscape-locked while keyboard attached)
exec-once = /home/user888/.local/bin/fan-profile-osd   # OSD when the fan/perf profile changes (Fn+F5)
exec-once = pactl load-module module-bluetooth-policy
exec-once = pactl load-module module-bluetooth-discover
exec-once = ~/.local/bin/buds-case-watcher             # buds6.png overlay while the CASE is open (fades on close; needs buds-daemon)
exec-once = ~/.local/bin/buds-daemon                   # live L/R/case battery listener (owns control channel; right-click widget to toggle)
exec-once = ~/.local/bin/lid-sleep-toggle restore      # re-apply persisted "suspend on lid close" state (Fn+F12 toggles it)

# Wallpaper (using hyprpaper or swaybg)
exec-once = swaybg -i ~/.config/background.png -m fill
# Alternative: exec-once = hyprpaper

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Set programs that you use
$terminal = alacritty
$fileManager = thunar
$menu = wofi --show drun

# Some default env vars.
env = XCURSOR_THEME,Bibata-Modern-Green
env = XCURSOR_SIZE,24
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

# Wayland-native rendering for Qt/GTK/Mozilla (fixes blur under fractional scale).
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = SDL_VIDEODRIVER,wayland
env = _JAVA_AWT_WM_NONREPARENTING,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# X11-only apps (Steam) can't go native Wayland, so under fractional scale the
# compositor upscales them 1x->1.25x = blurry. force_zero_scaling makes XWayland
# surfaces render at native pixels (crisp) but ~20% smaller. Steam re-scales its
# own UI crisply via STEAM_FORCE_DESKTOPUI_SCALING to land at the right size.
# (verified 2026-08-06; games run fullscreen so are unaffected)
env = STEAM_FORCE_DESKTOPUI_SCALING,1.25
xwayland {
    force_zero_scaling = true
}

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = no
        tap-to-click = yes
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    
    repeat_rate = 80
    repeat_delay = 180
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 8
    gaps_out = 20
    border_size = 1
    col.active_border = rgba(ffff78ee)
    col.inactive_border = rgba(00000000)

    layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
}

decoration {
    rounding = 0
    
    blur {
        enabled = true
        size = 3
        passes = 1
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

# Blur the wofi launcher's transparent background.
layerrule = blur on, match:namespace wofi

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 2, myBezier
    animation = windowsOut, 1, 2, default, popin 80%
    animation = border, 1, 3, default
    animation = borderangle, 1, 3, default
    animation = fade, 1, 2, default
    animation = workspaces, 1, 2, default
    animation = layers, 1, 4, default, slide
}
dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_status = master
}

misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = 0 # Set to 0 to disable the anime mascot wallpapers
    vrr = 0 # Variable refresh rate: 0=off, 1=full, 2=fullscreen-only
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
# device:epic-mouse-v1 {
#     sensitivity = -0.5
# }

# Logitech MX Mechanical (Mac edition) — swap Alt/Win so the Opt key sends Super.
device {
    name = mx-mchncl-m-keyboard
    kb_options = altwin:swap_lalt_lwin
}

# Dell bluetooth mouse — slow it down.
device {
    name = dell-mouse
    sensitivity = -0.5
}

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Krita lives on its own special (scratchpad) workspace, summoned by the pen button
windowrule = match:class ^(org.kde.krita)$, workspace special:krita silent

# Rear-camera peek widget: mpv window titled "rearcam" -> small pinned 16:9 panel
# that slides in at the top-right (swipe down from the top-right corner triggers it).
windowrule = match:title ^(rearcam)$, float 1
windowrule = match:title ^(rearcam)$, size 320 180
# position is set per-orientation by rearcam-widget (cam-geometry) before launch
windowrule = match:title ^(rearcam)$, pin 1
windowrule = match:title ^(rearcam)$, rounding 8
windowrule = match:title ^(rearcam)$, animation slide

# Front-camera peek widget: mpv window titled "frontcam" -> small pinned 16:9
# panel that slides in at the top-LEFT (swipe down from the top-left corner).
windowrule = match:title ^(frontcam)$, float 1
windowrule = match:title ^(frontcam)$, size 320 180
# position is set per-orientation by frontcam-widget (cam-geometry) before launch
windowrule = match:title ^(frontcam)$, pin 1
windowrule = match:title ^(frontcam)$, rounding 8
windowrule = match:title ^(frontcam)$, animation slide

# imv image viewer -> float a centered, rounded window instead of tiling
windowrule = match:class ^(imv)$, float 1
windowrule = match:class ^(imv)$, size 1000 700
windowrule = match:class ^(imv)$, center 1
windowrule = match:class ^(imv)$, rounding 8
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# Fullscreen for photoshop if you run it via Winehyprctl version


# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, KP_Enter, exec, $terminal

# Kill focused window
bind = $mainMod, Q, killactive,

# Claude Desktop
bind = ALT, Space, exec, claude-desktop --enable-features=UseOzonePlatform --ozone-platform=wayland

# Rofi launcher
bind = $mainMod, D, exec, $menu

# Fn+F12: toggle "suspend on lid close" on/off (OSD notification). Fn+F11 stays = sleep.
bind = , F12, exec, ~/.local/bin/lid-sleep-toggle

# OCR
bind = $mainMod SHIFT, O, exec, ~/.config/OCR4Linux/OCR4Linux.sh

# Emoji picker (rofimoji via wofi; types the glyph into the focused window with wtype)
bind = $mainMod, period, exec, ~/.local/bin/emoji-picker

# Lock screen (using swaylock or hyprlock)
bind = $mainMod, C, exec, swaylock -f -c 000000
# Alternative: bind = $mainMod, C, exec, hyprlock

# Fullscreen
bind = $mainMod, F, fullscreen, 0

# Floating
bind = $mainMod SHIFT, Space, togglefloating,
bind = $mainMod, Space, focuscurrentorlast,

# Layouts (similar to i3)
bind = $mainMod, S, exec, hyprctl keyword general:layout master
bind = $mainMod, E, exec, hyprctl keyword general:layout dwindle

# Split orientation (Hyprland handles this automatically, but we can force it)
bind = $mainMod, semicolon, layoutmsg, preselect r
bind = $mainMod, V, layoutmsg, preselect d

# Move focus with mainMod + hjkl
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move windows with mainMod + SHIFT + hjkl
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Move windows with mainMod + SHIFT + arrow keys
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Reload config
bind = $mainMod SHIFT, C, exec, hyprctl reload

# Exit Hyprland
bind = $mainMod SHIFT, E, exit,

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Resize mode (mainMod + R to enter, similar to i3)
bind = $mainMod, R, submap, resize

submap = resize
# Resize with hjkl
binde = , H, resizeactive, -10 0
binde = , L, resizeactive, 10 0
binde = , K, resizeactive, 0 -10
binde = , J, resizeactive, 0 10

# Resize with arrow keys
binde = , left, resizeactive, -10 0
binde = , right, resizeactive, 10 0
binde = , up, resizeactive, 0 -10
binde = , down, resizeactive, 0 10

# Exit resize mode
bind = , escape, submap, reset
bind = , return, submap, reset
bind = $mainMod, R, submap, reset
submap = reset

# Media keys
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindel = , XF86AudioRaiseVolume, exec, /home/user888/.local/bin/rocker up
bindel = , XF86AudioLowerVolume, exec, /home/user888/.local/bin/rocker down
# pinch both rocker buttons -> keyd emits F24 -> toggle volume/brightness mode
bind = , F24, exec, /home/user888/.local/bin/rocker toggle
bindl = , XF86AudioMute, exec, /home/user888/.local/bin/audio-mute sink
bindl = , XF86AudioMicMute, exec, /home/user888/.local/bin/audio-mute source
# prev/next track (Fn+F2 / Fn+F4 -> XF86AudioPrev/Next)
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next
# touchpad Fn key (sends KEY_F21 = xkb code:199) -> toggle the detachable keyboard's touchpad
bind = , code:199, exec, /home/user888/.local/bin/touchpad-toggle
# F7/F8 (keyboard's brightness Fn keys) -> KEYBOARD BACKLIGHT (screen brightness lives on the volume rocker now)
bindl = , code:233, exec, /home/user888/.local/bin/kbd-backlight up     # F8 = KEY_BRIGHTNESSUP   -> keyboard backlight up
bindl = , code:232, exec, /home/user888/.local/bin/kbd-backlight down   # F7 = KEY_BRIGHTNESSDOWN -> keyboard backlight down
# ASUS pen top button: single-click = Super+F20 (ignored); DOUBLE-click = Super+F19
# (keycode 197). Bind the raw code (keysym is remapped in the us keymap) -> Krita scratchpad.
bind = SUPER, code:197, exec, /home/user888/.local/bin/penbtn
# toggle the rear-camera webcam bridge (for Brave/V4L2 apps) — also a waybar button
bind = $mainMod SHIFT, C, exec, /home/user888/.local/bin/rearcam-bridge toggle