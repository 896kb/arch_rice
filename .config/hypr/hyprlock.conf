# hyprlock — styled lock screen (Tomorrow Night + green #b5bd68 accent, Departure Mono).
# Invoked by `loginctl lock-session` (via hypridle) and Super+C.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.config/background.png
    blur_passes = 3
    blur_size = 7
    brightness = 0.55
    contrast = 0.9
}

# big clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    font_size = 96
    font_family = Departure Mono
    color = rgba(181, 189, 104, 1.0)          # #b5bd68 green
    position = 0, 150
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    font_size = 22
    font_family = Departure Mono
    color = rgba(181, 189, 104, 0.85)         # #b5bd68 green
    position = 0, 60
    halign = center
    valign = center
}

# password input
input-field {
    monitor =
    size = 300, 56
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true
    rounding = 14
    outer_color = rgba(181, 189, 104, 1.0)      # #b5bd68 green
    inner_color = rgba(29, 31, 33, 0.85)        # #1d1f21
    font_color = rgba(181, 189, 104, 1.0)       # #b5bd68 green (password dots)
    fade_on_empty = false
    placeholder_text = <span foreground="##888888"><i>Enter password</i></span>
    check_color = rgba(181, 189, 104, 1.0)
    fail_color = rgba(204, 102, 102, 1.0)       # #cc6666
    fail_text = <i>$FAIL  ($ATTEMPTS)</i>
    position = 0, -50
    halign = center
    valign = center
}

# user
label {
    monitor =
    text = $USER
    font_size = 15
    font_family = Departure Mono
    color = rgba(181, 189, 104, 1.0)
    position = 0, 45
    halign = center
    valign = bottom
}
